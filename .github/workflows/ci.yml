# Pipeline de pruebas automatizadas — Petshop App Mobile
#
#   app-unitarios : tests JVM de la app (AUT-UNIT y AUT-NET) con Gradle.
#   api-newman    : levanta el backend con SQLite y los datos de prueba, y corre
#                   la colección de Postman con Newman (AUT-API).
#
# Los reportes quedan como artefactos de cada ejecución (pestaña Actions).

name: Pruebas

on:
  push:
    branches: [main, develop, release]
  pull_request:
    branches: [main, develop, release]

jobs:
  app-unitarios:
    name: App · tests unitarios y de red
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Permiso de ejecución de Gradle
        run: chmod +x gradlew

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-tests-app
          path: android/app/build/reports/tests/testDebugUnitTest/

  api-newman:
    name: API · colección Postman con Newman
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings_pruebas
      SECRET_KEY: clave-solo-para-el-pipeline-no-es-secreta
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      ACCESS_TOKEN_MINUTES: '60'
      REFRESH_TOKEN_DAYS: '7'
      DB_NAME: noaplica
      DB_USER: noaplica
      DB_PASSWORD: noaplica
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Dependencias (sin el driver de MySQL)
        run: |
          grep -v mysqlclient requirements.txt > requirements-pruebas.txt
          pip install -r requirements-pruebas.txt

      - name: Base de prueba y datos del seed
        run: |
          python manage.py migrate --noinput
          python manage.py seed

      - name: Levantar la API
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload &
          sleep 5
          curl -s -o /dev/null -w "API: %{http_code}\n" http://127.0.0.1:8000/api/

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Suite de la API
        working-directory: tests/api
        run: |
          mkdir -p reportes
          newman run Petshop-API.postman_collection.json \
            -e local.postman_environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reportes/api.html

      - name: Reporte de la API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-api
          path: tests/api/reportes/
