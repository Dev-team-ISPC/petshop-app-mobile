plugins {
    id 'com.android.application'
}

// La URL de la API sale de local.properties, que no se versiona.
// Cada integrante puede apuntar a su backend local sin tocar este archivo.
def props = new Properties()
def archivoProps = rootProject.file("local.properties")
if (archivoProps.exists()) {
    archivoProps.withInputStream { props.load(it) }
}
def urlApi = props.getProperty("API_URL", "https://petshop-api-sk23.onrender.com/api/")

android {
    namespace 'com.devteamispc.petshop'
    compileSdk 34

    defaultConfig {
        applicationId "com.devteamispc.petshop"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            // Por omision apunta al backend desplegado.
            // Para trabajar contra un backend local, agregar en local.properties:
            //   API_URL=http://10.0.2.2:8000/api/        (emulador)
            //   API_URL=http://192.168.0.XX:8000/api/    (telefono en la misma red)
            buildConfigField "String", "API_URL", "\"${urlApi}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_URL", '"https://petshop-api-sk23.onrender.com/api/"'
        }
    }

    buildFeatures {
        // En AGP 8 viene apagado por defecto: sin esto, BuildConfig.API_URL no existe
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}